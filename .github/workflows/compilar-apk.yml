
name: Compilar TempControl APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK firmado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/tempcontrol-release.p12"

          if [ ! -s "$GITHUB_WORKSPACE/tempcontrol-release.p12" ]; then
            echo "::error::No se pudo preparar la clave de firma."
            exit 1
          fi

          chmod 600 "$GITHUB_WORKSPACE/tempcontrol-release.p12"

            
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
        if: ${{ hashFiles('gradlew') != '' }}

      - name: Compilar APK firmado
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tempcontrol-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi


      - name: Guardar APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: TempControl-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
